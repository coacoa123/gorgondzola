<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GARGANTUYA | Luxury Life</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            touch-action: none;
        }

        /* --- ЭКРАН ЗАПУСКА --- */
        #intro {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 2s ease, visibility 2s ease;
        }
        #intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* МАССИВНАЯ КНОПКА ПИТАНИЯ */
        #powerBtn {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.3);
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(0,0,0,0.4) 100%);
            backdrop-filter: blur(15px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            box-shadow: 0 0 60px rgba(255,255,255,0.1), inset 0 0 60px rgba(255,255,255,0.05);
        }
        
        #powerBtn::before {
            content: '';
            position: absolute;
            inset: -5px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(212,175,55,0.3), rgba(255,255,255,0.1));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        #powerBtn:hover::before {
            opacity: 1;
        }
        
        #powerBtn:hover {
            transform: scale(1.15);
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 0 100px rgba(212,175,55,0.4), inset 0 0 80px rgba(255,255,255,0.1);
        }
        
        #powerBtn:active {
            transform: scale(1.08);
        }

        /* Символ питания */
        .power-icon {
            width: 60px;
            height: 60px;
            position: relative;
        }
        
        .power-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 28px;
            background: linear-gradient(to bottom, #fff, rgba(255,255,255,0.6));
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        
        .power-icon::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 52px;
            border: 6px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        /* Пульсация кнопки */
        @keyframes powerPulse {
            0%, 100% { box-shadow: 0 0 60px rgba(255,255,255,0.1), inset 0 0 60px rgba(255,255,255,0.05); }
            50% { box-shadow: 0 0 100px rgba(212,175,55,0.3), inset 0 0 80px rgba(255,255,255,0.1); }
        }
        
        #powerBtn {
            animation: powerPulse 3s infinite ease-in-out;
        }

        /* --- АМБИЕНТНАЯ ПОДСВЕТКА --- */
        .ambient-glow {
            position: fixed;
            width: 1000px;
            height: 1000px;
            border-radius: 50%;
            filter: blur(200px);
            opacity: 0.25;
            z-index: 1;
            animation: float 30s infinite ease-in-out;
            pointer-events: none;
        }
        .glow-1 {
            top: -400px; left: -400px;
            background: radial-gradient(circle, #D4AF37 0%, transparent 70%);
            animation-delay: 0s;
        }
        .glow-2 {
            bottom: -400px; right: -400px;
            background: radial-gradient(circle, #8B5A3C 0%, transparent 70%);
            animation-delay: 10s;
        }
        .glow-3 {
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #2E0854 0%, transparent 70%);
            animation-delay: 20s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
            33% { transform: translate(80px, 50px) scale(1.2); opacity: 0.35; }
            66% { transform: translate(-50px, 70px) scale(0.85); opacity: 0.15; }
        }

        /* --- СЛАЙДЫ --- */
        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 5s ease-in-out;
            z-index: 2;
            animation: slowZoom 35s infinite alternate ease-in-out;
        }
        .slide.active { opacity: 1; }
        
        .slide::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.75) 100%);
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        /* --- КНОПКА ЗВУКА --- */
        #audioControl {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 20;
            color: #fff;
            font-size: 0.6rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 1.5s ease 2s, all 0.3s ease;
            padding: 12px 22px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }
        #audioControl.visible { opacity: 1; }
        #audioControl:hover {
            border-color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.7);
        }
        
        .sound-wave {
            display: flex;
            gap: 3px;
            align-items: center;
            height: 12px;
        }
        .sound-wave span {
            display: block;
            width: 2px;
            background: #fff;
            animation: wave 1.2s infinite ease-in-out;
        }
        .sound-wave span:nth-child(1) { height: 4px; animation-delay: 0.1s; }
        .sound-wave span:nth-child(2) { height: 8px; animation-delay: 0.2s; }
        .sound-wave span:nth-child(3) { height: 12px; animation-delay: 0.3s; }
        .sound-wave span:nth-child(4) { height: 6px; animation-delay: 0.4s; }
        
        .sound-wave.paused span { animation: none; height: 2px; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.3); }
        }

        .live-dot {
            width: 5px;
            height: 5px;
            background: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3333;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        /* --- МОБИЛЬНАЯ АДАПТАЦИЯ --- */
        @media (max-width: 768px) {
            #powerBtn {
                width: 120px;
                height: 120px;
            }
            
            .power-icon {
                width: 50px;
                height: 50px;
            }
            
            .power-icon::before {
                width: 6px;
                height: 24px;
            }
            
            .power-icon::after {
                width: 42px;
                height: 42px;
                border-width: 5px;
                bottom: 6px;
            }
            
            #audioControl {
                bottom: 20px;
                right: 20px;
                padding: 10px 18px;
                font-size: 0.55rem;
            }
            
            .ambient-glow {
                width: 600px;
                height: 600px;
            }
        }

        @media (max-width: 480px) {
            #powerBtn {
                width: 100px;
                height: 100px;
            }
            
            .power-icon {
                width: 42px;
                height: 42px;
            }
            
            .power-icon::before {
                width: 5px;
                height: 20px;
            }
            
            .power-icon::after {
                width: 36px;
                height: 36px;
                border-width: 4px;
                bottom: 5px;
            }
            
            #audioControl {
                padding: 8px 14px;
                font-size: 0.5rem;
                gap: 8px;
            }
            
            .sound-wave {
                height: 10px;
            }
            
            .sound-wave span:nth-child(1) { height: 3px; }
            .sound-wave span:nth-child(2) { height: 6px; }
            .sound-wave span:nth-child(3) { height: 10px; }
            .sound-wave span:nth-child(4) { height: 5px; }
        }
    </style>
</head>
<body>

    <!-- Амбиентная подсветка -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <!-- Экран запуска с кнопкой питания -->
    <div id="intro">
        <button id="powerBtn" aria-label="Power On">
            <div class="power-icon"></div>
        </button>
    </div>

    <!-- Контейнер для слайдов -->
    <div id="slides-container"></div>

    <!-- Кнопка звука -->
    <div id="audioControl" onclick="toggleAudio()">
        <div class="sound-wave" id="wave">
            <span></span><span></span><span></span><span></span>
        </div>
        <span>LIVE</span>
        <div class="live-dot"></div>
    </div>

    <audio id="bgMusic" preload="none"></audio>

    <script>
        // ==========================================
        // ⚙️ НАСТРОЙКИ
        // ==========================================
        
        // 🖼️ БАЗОВЫЕ ЛАКШЕРИ-ФОТО (50 штук)
        const defaultPhotos = [
            'https://images.unsplash.com/photo-1544636331-e26879cd4d9b?w=1920&q=80', // Cadillac
            'https://images.unsplash.com/photo-1502680390548-bdbac40a5e20?w=1920&q=80', // Surfing
            'https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1920&q=80', // Mountains
            'https://images.unsplash.com/photo-1473968512647-3e447244af8f?w=1920&q=80', // Mountains
            'https://images.unsplash.com/photo-1459749411175-04bf5292ceea?w=1920&q=80', // Concert
            'https://images.unsplash.com/photo-1533106497176-45ae19e68ba2?w=1920&q=80', // Yacht
            'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=80', // Mountains
            'https://images.unsplash.com/photo-1504215680853-026ed2a45def?w=1920&q=80', // Office luxury
            'https://images.unsplash.com/photo-1519167758481-83f550bb49b3?w=1920&q=80', // Luxury interior
            'https://images.unsplash.com/photo-1540962351504-03099e0a754b?w=1920&q=80', // Helicopter
            'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=1920&q=80', // Cocktail luxury
            'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=1920&q=80', // Mountain hiker
            'https://images.unsplash.com/photo-1507608869274-d3177c8bb4c7?w=1920&q=80', // Ocean waves
            'https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=1920&q=80', // Ocean
            'https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=1920&q=80', // Car road
            'https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1920&q=80', // Landscape
            'https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1920&q=80', // Lake mountains
            'https://images.unsplash.com/photo-1519677100203-a0e668c92439?w=1920&q=80', // Castle
            'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1920&q=80', // Nature
            'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1920&q=80', // Forest
            'https://images.unsplash.com/photo-1505144808419-1957a94ca61e?w=1920&q=80', // Waterfall
            'https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=1920&q=80', // Waterfall
            'https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1920&q=80', // Nature
            'https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=1920&q=80', // Night sky
            'https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=1920&q=80', // Car luxury
            'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1920&q=80', // Hotel luxury
            'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=1920&q=80', // Watch luxury
            'https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=1920&q=80', // Hotel lobby
            'https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=1920&q=80', // Resort
            'https://images.unsplash.com/photo-1571896349842-33c894242d2b?w=1920&q=80', // Hotel pool
            'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=1920&q=80', // Hotel room
            'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=1920&q=80', // Mansion
            'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?w=1920&q=80', // Modern house
            'https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=1920&q=80', // Bathroom luxury
            'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?w=1920&q=80', // House exterior
            'https://images.unsplash.com/photo-1600047509807-ba8f99d2cdde?w=1920&q=80', // Kitchen luxury
            'https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?w=1920&q=80', // Living room
            'https://images.unsplash.com/photo-1600573472591-ee6c563aaecb?w=1920&q=80', // Mansion exterior
            'https://images.unsplash.com/photo-1600566752355-35792bedcfea?w=1920&q=80', // Bedroom luxury
            'https://images.unsplash.com/photo-1600585152220-90363fe7e115?w=1920&q=80', // House luxury
            'https://images.unsplash.com/photo-1600566752229-250ed79470f8?w=1920&q=80', // Bathroom modern
            'https://images.unsplash.com/photo-1600121848594-d8644e57abab?w=1920&q=80', // Pool luxury
            'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=1920&q=80', // House modern
            'https://images.unsplash.com/photo-1600585154526-990dced4db0d?w=1920&q=80', // Interior modern
            'https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?w=1920&q=80', // House night
            'https://images.unsplash.com/photo-1600566752355-83974869b2d2?w=1920&q=80', // Bedroom modern
            'https://images.unsplash.com/photo-1600566752229-250ed79470f7?w=1920&q=80', // Staircase luxury
            'https://images.unsplash.com/photo-1600047509358-9dc75507daeb?w=1920&q=80', // Kitchen modern
            'https://images.unsplash.com/photo-1600121848594-d8644e57ab3c?w=1920&q=80', // Pool night
            'https://images.unsplash.com/photo-1600047508369-487e46f4e87c?w=1920&q=80', // Dining room
        ];

        // 📁 ТВОИ ФОТО — просто добавляй сюда photo1, photo2 и т.д.
        const myPhotos = [];
        // Пример: 
        // for (let i = 1; i <= 150; i++) {
        //     myPhotos.push(`photo${i}.jpg`);
        // }

        const SLIDE_DURATION = 10000; // 10 секунд
        const RADIO_STREAM = 'https://stream.zeno.fm/p49hqzfxmb4uv';

        // ==========================================

        // 🎲 Перемешивание массива
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // 🖼️ Создаём слайды
        const container = document.getElementById('slides-container');
        const allPhotos = [...defaultPhotos, ...myPhotos];
        const shuffledPhotos = shuffleArray(allPhotos);
        let slides = [];
        let loadedSlidesCount = 0;

        shuffledPhotos.forEach((photo, index) => {
            const slide = document.createElement('div');
            slide.className = 'slide' + (index === 0 ? ' active' : '');
            slide.style.backgroundImage = `url('${photo}')`;
            slide.dataset.src = photo;
            slide.style.display = 'none'; // Скрываем пока не загрузится
            container.appendChild(slide);
            slides.push(slide);
        });

        // 🛡️ Проверка загрузки фото
        slides.forEach((slide, idx) => {
            const img = new Image();
            img.onload = () => {
                slide.style.display = 'block';
                loadedSlidesCount++;
                console.log(`✅ Загружено (${loadedSlidesCount}/${slides.length}): ${slide.dataset.src}`);
                // Если это первый загруженный слайд — делаем его активным
                if (loadedSlidesCount === 1 && !document.querySelector('.slide.active')) {
                    slide.classList.add('active');
                }
            };
            img.onerror = () => {
                console.warn(`❌ Не загружено: ${slide.dataset.src}`);
                slide.remove();
                slides = slides.filter(s => s !== slide);
            };
            img.src = slide.dataset.src;
        });

        // 🎵 Аудио и управление
        const audio = document.getElementById('bgMusic');
        const intro = document.getElementById('intro');
        const powerBtn = document.getElementById('powerBtn');
        const audioControl = document.getElementById('audioControl');
        const wave = document.getElementById('wave');
        
        let currentSlide = 0;
        let isPlaying = false;
        let slideInterval = null;

        // Запуск по кнопке питания
        powerBtn.addEventListener('click', () => {
            intro.classList.add('hidden');
            audioControl.classList.add('visible');
            startExperience();
        });

        function startExperience() {
            audio.src = RADIO_STREAM;
            audio.play().catch(e => console.log("Ожидание:", e));
            isPlaying = true;
            slideInterval = setInterval(nextSlide, SLIDE_DURATION);
        }

        function nextSlide() {
            if (slides.length === 0) return;
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                wave.classList.add('paused');
                isPlaying = false;
            } else {
                audio.play();
                wave.classList.remove('paused');
                isPlaying = true;
            }
        }

        // ⌨️ Пробел = пауза/воспроизведение
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (!intro.classList.contains('hidden')) {
                    powerBtn.click();
                } else {
                    toggleAudio();
                }
                e.preventDefault();
            }
        });

        // 🛡️ Переподключение радио
        audio.addEventListener('error', function() {
            console.log("Поток прерван, переподключение...");
            wave.classList.add('paused');
            setTimeout(() => {
                audio.load();
                if (isPlaying) {
                    audio.play().catch(e => console.log("Переподключение..."));
                    wave.classList.remove('paused');
                }
            }, 5000);
        });

        //  Touch события для мобильных
        let touchStartY = 0;
        document.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        }, {passive: true});

        document.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            const diff = touchStartY - touchEndY;
            // Свайп вверх/вниз для переключения слайдов на мобильных
            if (Math.abs(diff) > 50 && slides.length > 0) {
                if (diff > 0) {
                    nextSlide();
                } else {
                    slides[currentSlide].classList.remove('active');
                    currentSlide = (currentSlide - 1 + slides.length) % slides.length;
                    slides[currentSlide].classList.add('active');
                }
            }
        }, {passive: true});
    </script>
</body>
</html>
