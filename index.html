<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARGANTUYA | Luxury Life</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #intro {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 2s ease, visibility 2s ease;
        }
        #intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        
        #enterBtn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 18px 50px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.5s ease;
        }
        #enterBtn:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.6);
            box-shadow: 0 0 40px rgba(255,255,255,0.2);
        }

        .ambient-glow {
            position: fixed;
            width: 1000px;
            height: 1000px;
            border-radius: 50%;
            filter: blur(200px);
            opacity: 0.2;
            z-index: 1;
            animation: float 30s infinite ease-in-out;
            pointer-events: none;
        }
        .glow-1 {
            top: -400px; left: -400px;
            background: radial-gradient(circle, #D4AF37 0%, transparent 70%);
            animation-delay: 0s;
        }
        .glow-2 {
            bottom: -400px; right: -400px;
            background: radial-gradient(circle, #8B5A3C 0%, transparent 70%);
            animation-delay: 10s;
        }
        .glow-3 {
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #2E0854 0%, transparent 70%);
            animation-delay: 20s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            33% { transform: translate(80px, 50px) scale(1.2); opacity: 0.3; }
            66% { transform: translate(-50px, 70px) scale(0.85); opacity: 0.15; }
        }

        .slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 5s ease-in-out;
            z-index: 2;
            animation: slowZoom 35s infinite alternate ease-in-out;
        }
        .slide.active { opacity: 1; }
        
        .slide::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0,0,0,0.7) 100%);
        }

        @keyframes slowZoom {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        #audioControl {
            position: fixed;
            bottom: 50px;
            right: 50px;
            z-index: 20;
            color: #fff;
            font-size: 0.65rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 1.5s ease 2s, background 0.3s ease, border-color 0.3s ease;
            padding: 14px 28px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }
        #audioControl.visible { opacity: 1; }
        #audioControl:hover {
            border-color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.6);
        }
        
        .sound-wave {
            display: flex;
            gap: 3px;
            align-items: center;
            height: 15px;
        }
        .sound-wave span {
            display: block;
            width: 2px;
            background: #fff;
            animation: wave 1.2s infinite ease-in-out;
        }
        .sound-wave span:nth-child(1) { height: 4px; animation-delay: 0.1s; }
        .sound-wave span:nth-child(2) { height: 10px; animation-delay: 0.2s; }
        .sound-wave span:nth-child(3) { height: 15px; animation-delay: 0.3s; }
        .sound-wave span:nth-child(4) { height: 7px; animation-delay: 0.4s; }
        
        .sound-wave.paused span { animation: none; height: 2px; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.3); }
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff3333;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div id="intro">
        <button id="enterBtn">Войти</button>
    </div>

    <!-- Слайды будут добавлены автоматически через JavaScript -->
    <div id="slides-container"></div>

    <div id="audioControl" onclick="toggleAudio()">
        <div class="sound-wave" id="wave">
            <span></span><span></span><span></span><span></span>
        </div>
        <span>LIVE</span>
        <div class="live-dot"></div>
    </div>

    <audio id="bgMusic" preload="none"></audio>

    <script>
        // ==========================================
        // ⚙️ НАСТРОЙКИ (меняй только здесь!)
        // ==========================================
        const TOTAL_PHOTOS = 150;          // Сколько фото у тебя всего (photo1.jpg ... photo150.jpg)
        const PHOTO_PREFIX = 'photo';      // Префикс имени файла
        const PHOTO_EXTENSION = '.jpg';    // Расширение файла (.jpg или .png)
        const SLIDE_DURATION = 10000;      // Время показа одного фото в мс (10000 = 10 сек)
        const RADIO_STREAM = 'https://stream.zeno.fm/p49hqzfxmb4uv';
        // ==========================================

        // 🎲 Функция перемешивания массива (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 🖼️ Генерируем список фото и перемешиваем
        const photoList = [];
        for (let i = 1; i <= TOTAL_PHOTOS; i++) {
            photoList.push(`${PHOTO_PREFIX}${i}${PHOTO_EXTENSION}`);
        }
        const shuffledPhotos = shuffleArray(photoList);

        // Создаём слайды в DOM
        const container = document.getElementById('slides-container');
        shuffledPhotos.forEach((photo, index) => {
            const slide = document.createElement('div');
            slide.className = 'slide' + (index === 0 ? ' active' : '');
            slide.style.backgroundImage = `url('${photo}')`;
            slide.dataset.src = photo;
            container.appendChild(slide);
        });

        // 🎵 Аудио и слайдер
        const audio = document.getElementById('bgMusic');
        const intro = document.getElementById('intro');
        const enterBtn = document.getElementById('enterBtn');
        const slides = document.querySelectorAll('.slide');
        const audioControl = document.getElementById('audioControl');
        const wave = document.getElementById('wave');
        
        let currentSlide = 0;
        let isPlaying = false;

        enterBtn.addEventListener('click', () => {
            intro.classList.add('hidden');
            audioControl.classList.add('visible');
            startExperience();
        });

        function startExperience() {
            audio.src = RADIO_STREAM;
            audio.play().catch(e => console.log("Ожидание взаимодействия:", e));
            isPlaying = true;
            setInterval(nextSlide, SLIDE_DURATION);
        }

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function toggleAudio() {
            if (isPlaying) {
                audio.pause();
                wave.classList.add('paused');
                isPlaying = false;
            } else {
                audio.play();
                wave.classList.remove('paused');
                isPlaying = true;
            }
        }

        // 🛡️ Если фото не загрузилось — пропускаем его
        slides.forEach(slide => {
            slide.addEventListener('error', () => {
                console.log(`Фото ${slide.dataset.src} не найдено, пропускаем`);
                slide.style.display = 'none';
            });
        });

        // 🛡️ Автоматическое переподключение радио при обрыве
        audio.addEventListener('error', function() {
            console.log("Поток прерван, переподключение...");
            wave.classList.add('paused');
            setTimeout(() => {
                audio.load();
                if (isPlaying) {
                    audio.play().catch(e => console.log("Переподключение..."));
                    wave.classList.remove('paused');
                }
            }, 5000);
        });
    </script>
</body>
</html>
